name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main   # branch to deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build NestJS
        run: npm run build

      - name: Create .env
        run: |
           echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
           echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
           echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
           echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env
           echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
           echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
           echo "DB_SSL=${{ secrets.DB_SSL }}" >> .env
           echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
           echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
           echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
           echo "AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}" >> .env
           echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
           echo "APP_URL=${{ secrets.APP_URL }}" >> .env
           echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env

      - name: Zip project
        run: zip -r deploy.zip . -x "node_modules/*" ".git/*"
      - name: Check region
        run: echo "Region is ${{ secrets.AWS_REGION }}"

      - name: Ensure Elastic Beanstalk application exists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          EB_APPLICATION_NAME: ${{ secrets.EB_APPLICATION_NAME }}
        run: |
          existing=$(aws elasticbeanstalk describe-applications \
            --application-names "$EB_APPLICATION_NAME" \
            --query "Applications[?ApplicationName=='${EB_APPLICATION_NAME}'] | length(@)" \
            --output text)
          if [ "$existing" = "0" ]; then
            echo "Elastic Beanstalk application '$EB_APPLICATION_NAME' not found, creating it..."
            aws elasticbeanstalk create-application --application-name "$EB_APPLICATION_NAME"
          else
            echo "Elastic Beanstalk application '$EB_APPLICATION_NAME' already exists."
          fi

      - name: Recover Elastic Beanstalk environment if its stack is stuck
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          EB_ENVIRONMENT_NAME: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          env_id=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --query "Environments[0].EnvironmentId" \
            --output text)

          if [ -z "$env_id" ] || [ "$env_id" = "None" ]; then
            echo "Environment '$EB_ENVIRONMENT_NAME' not found, skipping stack recovery."
            exit 0
          fi

          stack_name="awseb-e-${env_id}-stack"
          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$stack_name" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$stack_status" = "DELETE_FAILED" ]; then
            echo "CloudFormation stack '$stack_name' is stuck in DELETE_FAILED, forcing deletion of the resources that failed to delete..."
            retain=$(aws cloudformation list-stack-resources \
              --stack-name "$stack_name" \
              --query "StackResourceSummaries[?ResourceStatus=='DELETE_FAILED'].LogicalResourceId" \
              --output text)

            if [ -n "$retain" ] && [ "$retain" != "None" ]; then
              aws cloudformation delete-stack --stack-name "$stack_name" --retain-resources $retain
            else
              aws cloudformation delete-stack --stack-name "$stack_name"
            fi

            aws cloudformation wait stack-delete-complete --stack-name "$stack_name"
            echo "Stack '$stack_name' deleted. Rebuilding environment '$EB_ENVIRONMENT_NAME'..."

            aws elasticbeanstalk rebuild-environment --environment-name "$EB_ENVIRONMENT_NAME"
            aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENVIRONMENT_NAME"
            echo "Environment '$EB_ENVIRONMENT_NAME' has been rebuilt and is ready."
          else
            echo "Stack '$stack_name' status is '$stack_status', no recovery needed."
          fi

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          region: ${{ secrets.AWS_REGION }}
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
          use_existing_version_if_available: true